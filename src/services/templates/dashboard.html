<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
        }
        .face-card {
            width: 220px;
            margin: 10px;
            display: inline-block;
        }
        .face-image {
            height: 150px;
            object-fit: cover;
        }
        .capture-btn {
            margin: 5px;
        }
        .section {
            margin-bottom: 30px;
            padding: 15px;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .result-card {
            margin-bottom: 10px;
        }
        #addUserForm {
            max-width: 500px;
        }
        .verification-success {
            color: green;
            font-weight: bold;
        }
        .verification-failure {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Face Recognition Dashboard</h1>
        
        <!-- Capture Controls Section -->
        <div class="section">
            <h2>Face Capture</h2>
            <p>Capture images from different angles for better recognition.</p>
            <div class="d-flex">
                <button class="btn btn-primary capture-btn" onclick="captureImage('front')">Capture Front</button>
                <button class="btn btn-info capture-btn" onclick="captureImage('left')">Capture Left</button>
                <button class="btn btn-info capture-btn" onclick="captureImage('right')">Capture Right</button>
            </div>
        </div>
        
        <!-- Latest Faces Section -->
        <div class="section">
            <h2>Latest Detected Faces</h2>
            <div id="latestFaces" class="d-flex flex-wrap">
                <p>No faces detected yet.</p>
            </div>
        </div>
        
        <!-- Recognition Results Section -->
        <div class="section">
            <h2>Recognition Results</h2>
            <div id="recognitionResults">
                <p>No recognition results yet.</p>
            </div>
        </div>
        
        <!-- Add User Form Section -->
        <div class="section">
            <h2>Add New User</h2>
            <form id="addUserForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="userName" class="form-label">User Name</label>
                    <input type="text" class="form-control" id="userName" name="user_name" required>
                </div>
                <div class="mb-3">
                    <label for="userPassword" class="form-label">Password (Optional)</label>
                    <input type="password" class="form-control" id="userPassword" name="password">
                </div>
                <div class="mb-3">
                    <label for="faceImages" class="form-label">Face Images</label>
                    <input type="file" class="form-control" id="faceImages" name="face_image[]" multiple accept="image/*" required>
                    <div class="form-text">Upload one or more images of the user's face.</div>
                </div>
                <button type="submit" class="btn btn-success">Add User</button>
            </form>
            <div id="addUserStatus" class="mt-3"></div>
        </div>
    </div>

    <script>
        // Function to capture an image
        function captureImage(direction) {
            fetch(`/api/capture/${direction}`)
                .then(response => response.json())
                .then(data => {
                    console.log(`Capture ${direction} response:`, data);
                    // Update UI with status message
                    const statusMsg = document.createElement('div');
                    statusMsg.className = data.status === 'success' ? 'alert alert-success' : 'alert alert-danger';
                    statusMsg.textContent = data.message;
                    statusMsg.style.position = 'fixed';
                    statusMsg.style.top = '20px';
                    statusMsg.style.right = '20px';
                    document.body.appendChild(statusMsg);
                    
                    // Remove the status message after 3 seconds
                    setTimeout(() => {
                        statusMsg.remove();
                    }, 3000);
                    
                    // Update faces and results after a short delay
                    setTimeout(updateData, 1000);
                })
                .catch(error => console.error('Error capturing image:', error));
        }
        
        // Function to update latest faces and recognition results
        function updateData() {
            // Update latest faces
            fetch('/api/latest_faces')
                .then(response => response.json())
                .then(data => {
                    const facesContainer = document.getElementById('latestFaces');
                    
                    if (Object.keys(data).length === 0) {
                        facesContainer.innerHTML = '<p>No faces detected yet.</p>';
                        return;
                    }
                    
                    facesContainer.innerHTML = '';
                    for (const [faceId, imageData] of Object.entries(data)) {
                        const card = document.createElement('div');
                        card.className = 'card face-card';
                        card.innerHTML = `
                            <img src="data:image/jpeg;base64,${imageData}" class="card-img-top face-image" alt="Face ${faceId}">
                            <div class="card-body">
                                <h5 class="card-title">Face ID: ${faceId}</h5>
                            </div>
                        `;
                        facesContainer.appendChild(card);
                    }
                })
                .catch(error => console.error('Error fetching latest faces:', error));
            
            // Update recognition results
            fetch('/api/latest_results')
                .then(response => response.json())
                .then(data => {
                    const resultsContainer = document.getElementById('recognitionResults');
                    
                    if (Object.keys(data).length === 0) {
                        resultsContainer.innerHTML = '<p>No recognition results yet.</p>';
                        return;
                    }
                    
                    resultsContainer.innerHTML = '';
                    for (const [faceId, result] of Object.entries(data)) {
                        const verificationClass = result.verified ? 'verification-success' : 'verification-failure';
                        const verificationText = result.verified ? 'Verified' : 'Not Verified';
                        
                        const card = document.createElement('div');
                        card.className = 'card result-card';
                        card.innerHTML = `
                            <div class="card-body">
                                <h5 class="card-title">Face ID: ${faceId}</h5>
                                <p class="card-text">User: <strong>${result.user_name}</strong></p>
                                <p class="card-text">Status: <span class="${verificationClass}">${verificationText}</span></p>
                                <p class="card-text">Confidence: ${(result.confidence * 100).toFixed(2)}%</p>
                                <p class="card-text"><small class="text-muted">Time: ${result.date_time}</small></p>
                            </div>
                        `;
                        resultsContainer.appendChild(card);
                    }
                })
                .catch(error => console.error('Error fetching recognition results:', error));
        }
        
        // Handle form submission for adding a new user
        document.getElementById('addUserForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const formData = new FormData(this);
            
            fetch('/api/add_user', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const statusContainer = document.getElementById('addUserStatus');
                statusContainer.className = data.status === 'success' ? 'alert alert-success' : 'alert alert-danger';
                statusContainer.textContent = data.message;
                
                if (data.status === 'success') {
                    // Reset form on success
                    document.getElementById('addUserForm').reset();
                }
            })
            .catch(error => {
                console.error('Error adding user:', error);
                const statusContainer = document.getElementById('addUserStatus');
                statusContainer.className = 'alert alert-danger';
                statusContainer.textContent = 'An error occurred while adding the user. Please try again.';
            });
        });
        
        // Update data initially and then every 5 seconds
        updateData();
        setInterval(updateData, 5000);
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
