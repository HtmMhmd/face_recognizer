version: '3.8'

services:
  # Base image with common dependencies
  face-recognition-base:
    image: face-recognition-base:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - "never-run"  # This service is never run directly

  # Capture Service
  capture-service:
    extends:
      service: face-recognition-base
    container_name: fr-capture-service
    command: ["python", "-m", "src.services.capture_service", "--capture-port", "5555", "--image-port", "5556", "--host", "dashboard-service"]
    volumes:
      - ./:/app:ro
    devices:
      - /dev/video0:/dev/video0
    networks:
      - face-net
    depends_on:
      - dashboard-service
    restart: unless-stopped

  # Image Processing Service
  image-processing-service:
    extends:
      service: face-recognition-base
    container_name: fr-image-processing-service
    command: ["python", "-m", "src.services.image_processing_service", "--image-port", "5556", "--cropped-face-port", "5557", "--host", "capture-service", "--detector", "mediapipe"]
    volumes:
      - ./:/app:ro
    networks:
      - face-net
    depends_on:
      - capture-service
    restart: unless-stopped

  # Recognition Service
  recognition-service:
    extends:
      service: face-recognition-base
    container_name: fr-recognition-service
    command: ["python", "-m", "src.services.recognition_service", "--cropped-face-port", "5557", "--recognition-port", "5558", "--add-user-port", "5559", "--add-user-response-port", "5560", "--host", "image-processing-service"]
    volumes:
      - ./:/app:ro
      - face-db-data:/data:rw
    networks:
      - face-net
    depends_on:
      - image-processing-service
      - db-service
    restart: unless-stopped

  # Dashboard Service
  dashboard-service:
    extends:
      service: face-recognition-base
    container_name: fr-dashboard-service
    command: ["python", "-m", "src.services.dashboard_service", "--capture-port", "5555", "--cropped-face-port", "5557", "--recognition-port", "5558", "--add-user-port", "5559", "--add-user-response-port", "5560", "--host", "recognition-service", "--dashboard-host", "0.0.0.0", "--dashboard-port", "8080"]
    volumes:
      - ./:/app:ro
    ports:
      - "8080:8080"  # Expose dashboard UI
    networks:
      - face-net
    depends_on:
      - db-service
    restart: unless-stopped

  # Database Service with ZMQ communication
  db-service:
    extends:
      service: face-recognition-base
    container_name: fr-db-service
    command: ["python", "-m", "src.services.database_service", "--db-request-port", "5561", "--db-response-port", "5562", "--deployment-mode", "docker"]
    volumes:
      - ./:/app:ro
      - face-db-data:/data:rw
    ports:
      - "5000:5000"  # Keep HTTP port for backward compatibility
    restart: unless-stopped
    networks:
      - face-net

  # MJPG Streamer (optional, used for streaming video feed)
  mjpg-streamer:
    image: htmmhmd/mjpg-streamer:latest
    container_name: fr-mjpg-streamer
    ports:
      - "8081:8080"  # Changed port to avoid conflict with dashboard
    devices:
      - /dev/video0:/dev/video0
    environment:
      - CAMERA_DEVICE=/dev/video0
      - STREAM_PORT=8080
    restart: always
    networks:
      - face-net
    privileged: true

networks:
  face-net:
    driver: bridge

volumes:
  face-db-data:
    driver: local
