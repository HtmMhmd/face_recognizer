name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: 'arm64,arm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push x86_64 image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest-amd64,${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:${{ steps.meta.outputs.version }}-amd64
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-amd64
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-amd64,mode=max

      - name: Build and push ARM image (Raspberry Pi)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest-arm,${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:${{ steps.meta.outputs.version }}-arm
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-arm
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-arm,mode=max

      - name: Create manifest and push multi-arch image
        if: github.event_name != 'pull_request'
        run: |
          docker manifest create ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest-arm
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            docker manifest create ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:$VERSION \
              ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:$VERSION-amd64 \
              ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:$VERSION-arm
            docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:$VERSION
          fi
          
          docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest
