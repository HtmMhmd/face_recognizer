name: Build and Push Docker Images

# Defines when this workflow will run
on:
  push:
    branches: [ main ]    # Run when code is pushed to main branch
    tags:
      - 'v*'              # Run when a version tag is pushed (e.g., v1.0.0)
  pull_request:
    branches: [ main ]    # Run when a PR targets the main branch
  workflow_dispatch:      # Allow manual triggering from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner
    steps:
      # Step 1: Check out the repository code
      - name: Checkout
        uses: actions/checkout@v3  # Standard action to clone the repository

      # Step 2: Set up QEMU for multi-architecture builds
      # This allows Docker to emulate ARM processors on x86 machines
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: 'arm64,arm'  # Enable ARM emulation for Raspberry Pi builds

      # Step 3: Set up Docker Buildx for multi-architecture builds
      # Buildx is a Docker CLI plugin that extends docker build with multi-arch support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 4: Log in to Docker Hub with credentials stored in GitHub Secrets
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # Your Docker Hub username
          password: ${{ secrets.DOCKERHUB_TOKEN }}     # Your Docker Hub access token

      # Step 5: Extract metadata for Docker tags based on Git context
      # This creates appropriate tags for branches, PRs, and version tags
      - name: Extract metadata
        id: meta  # ID to reference this step later
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer  # Base image name
          tags: |  # Tag generation rules
            type=ref,event=branch                  # Tag with branch name
            type=ref,event=pr                      # Tag with PR number
            type=semver,pattern={{version}}        # Tag with full semantic version (v1.0.0)
            type=semver,pattern={{major}}.{{minor}}  # Tag with major.minor version (v1.0)
            type=sha,format=short                  # Tag with git SHA short form

      # Step 6: Build and push x86_64 (AMD64) image
      - name: Build and push x86_64 image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64    # Single platform to avoid manifest list issues
          push: ${{ github.event_name != 'pull_request' }}
          # Specify a clear single-architecture tag
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:amd64-${{ steps.meta.outputs.version || 'latest' }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-amd64
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-amd64,mode=max

      # Step 7: Build and push ARM image for Raspberry Pi
      - name: Build and push ARM image (Raspberry Pi)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64/v8    # Single platform to avoid manifest list issues
          push: ${{ github.event_name != 'pull_request' }}
          # Specify a clear single-architecture tag
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:arm64-${{ steps.meta.outputs.version || 'latest' }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-arm
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-arm,mode=max

      # Step 8: Create and push multi-architecture manifest with fixed references
      - name: Create manifest and push multi-arch image
        if: github.event_name != 'pull_request'
        run: |
          # Enable experimental features to use docker manifest command
          echo '{"experimental": true}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          
          # If this was triggered by a version tag, also create a versioned manifest
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            docker manifest create ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:$VERSION \
              ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:amd64-$VERSION \
              ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:arm64-$VERSION
            docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:$VERSION
          fi
          
          docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest
