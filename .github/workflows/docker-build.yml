name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: 'arm64,amd64'  # Fixed duplicated platforms

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/face_recognition
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Generate version number
        id: version
        run: |
            LATEST_TAG=$(git tag --sort=-v:refname | grep "^v[0-9]*\.[0-9]*\.[0-9]*$" | head -n 1 || echo "v0.0.0")
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                PATCH=$((PATCH + 1))
            fi
            
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                NEW_VERSION=${GITHUB_REF#refs/tags/v}
            else
                NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            fi
            
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Generated version: $NEW_VERSION"

      # Removed the redundant build step and kept only one
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
            context: .
            file: ./Dockerfile
            platforms: linux/amd64,linux/arm64/v8
            push: true
            tags: |
                ${{ secrets.DOCKERHUB_USERNAME }}/face_recognition:latest
                ${{ secrets.DOCKERHUB_USERNAME }}/face_recognition:${{ steps.version.outputs.new_version }}
                ${{ secrets.DOCKERHUB_USERNAME }}/face_recognition:${{ github.ref_name }}