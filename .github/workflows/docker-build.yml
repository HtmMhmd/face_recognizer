name: Build and Push Docker Images

# Defines when this workflow will run
on:
  push:
    branches: [ main ]    # Run when code is pushed to main branch
    tags:
      - 'v*'              # Run when a version tag is pushed (e.g., v1.0.0)
  pull_request:
    branches: [ main ]    # Run when a PR targets the main branch
  workflow_dispatch:      # Allow manual triggering from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner
    steps:
      # Step 1: Check out the repository code
      - name: Checkout
        uses: actions/checkout@v3  # Standard action to clone the repository

      # Step 2: Set up QEMU for multi-architecture builds
      # This allows Docker to emulate ARM processors on x86 machines
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: 'arm64,arm'  # Enable ARM emulation for Raspberry Pi builds

      # Step 3: Set up Docker Buildx for multi-architecture builds
      # Buildx is a Docker CLI plugin that extends docker build with multi-arch support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 4: Log in to Docker Hub with credentials stored in GitHub Secrets
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # Your Docker Hub username
          password: ${{ secrets.DOCKERHUB_TOKEN }}     # Your Docker Hub access token

      # Step 5: Extract metadata for Docker tags based on Git context
      # This creates appropriate tags for branches, PRs, and version tags
      - name: Extract metadata
        id: meta  # ID to reference this step later
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer  # Base image name
          tags: |  # Tag generation rules
            type=ref,event=branch                  # Tag with branch name
            type=ref,event=pr                      # Tag with PR number
            type=semver,pattern={{version}}        # Tag with full semantic version (v1.0.0)
            type=semver,pattern={{major}}.{{minor}}  # Tag with major.minor version (v1.0)
            type=sha,format=short                  # Tag with git SHA short form

      # Step 6: Build and push x86_64 (AMD64) image
      # This builds the image for standard desktop/server architecture
      - name: Build and push x86_64 image
        uses: docker/build-push-action@v4
        with:
          context: .                # Use current directory as build context
          file: ./Dockerfile        # Use the main Dockerfile
          platforms: linux/amd64    # Build for x86_64 architecture
          push: ${{ github.event_name != 'pull_request' }}  # Push only if not a PR
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest-amd64,${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:${{ steps.meta.outputs.version }}-amd64
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-amd64  # Use cache from registry
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-amd64,mode=max  # Save cache to registry

      # Step 7: Build and push ARM image for Raspberry Pi
      # This builds images compatible with both ARM64 and ARMv8 (RPi 3/4)
      - name: Build and push ARM image (Raspberry Pi)
        uses: docker/build-push-action@v4
        with:
          context: .                        # Use current directory as build context
          file: ./Dockerfile                # Use the main Dockerfile
          platforms:  linux/arm64/v8  # Build for both ARM64 and ARMv8 (RPi 3/4)
          push: ${{ github.event_name != 'pull_request' }}  # Push only if not a PR
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest-arm,${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:${{ steps.meta.outputs.version }}-arm
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-arm  # Use cache from registry
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:buildcache-arm,mode=max  # Save cache to registry

      # Step 8: Create and push multi-architecture manifest
      # This combines the architecture-specific images into a single multi-arch image
      - name: Create manifest and push multi-arch image
        if: github.event_name != 'pull_request'  # Only run on pushes, not PRs
        run: |
          # Create a manifest for the "latest" tag that includes both architectures
          docker manifest create ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest-arm
          
          # If this was triggered by a version tag (v1.0.0), also create a versioned manifest
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}  # Extract version number from tag
            docker manifest create ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:$VERSION \
              ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:$VERSION-amd64 \
              ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:$VERSION-arm
            docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:$VERSION  # Push versioned manifest
          fi
          
          docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/face_recognizer:latest  # Push latest manifest
