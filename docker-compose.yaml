version: '3.8'

services:
  # Base service definition (not to be run directly)
  face-recognition-base:
    image: htmmhmd/face_recognition:3.1.4
    profiles:
      - "never-run"  # This service is never run directly
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - AV_LOG_LEVEL=0
      - OPENCV_FFMPEG_LOGLEVEL=0
    volumes:
      - ./:/app:ro
    ipc: host

  # Main face recognition service
  face_recognizer:
    extends:
      service: face-recognition-base
    container_name: fr-main-service
    environment:
      - DB_API_URL=http://db_service:5000
    volumes:
      - ./data/database:/data:rw
      - './profiles:/app/profiles:rw'
    devices:
      - /dev/video0:/dev/video0
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - db_service
      - mjpg-streamer
    networks:
      - face_net
    ports:
      - "8000:8000"
      - "5555:5555"
      - "5544:5544"
    command: ["python", "run.py", '--handler', 'regular']

  # User registration service
  add_user_service:
    extends:
      service: face-recognition-base
    container_name: fr-add-user-service
    environment:
      - DB_API_URL=http://db_service:5000
    volumes:
      - ./data/database:/data:rw
      - './profiles:/app/profiles:rw'
    devices:
      - /dev/video0:/dev/video0
    restart: unless-stopped
    depends_on:
      - db_service
    networks:
      - face_net
    ports:
      - "5556:5555"
      - "5545:5544"
    command: ["python", "add_user_automation.py", "--handler", "regular"]

  # Authentication service
  auth_service:
    extends:
      service: face-recognition-base
    container_name: fr-auth-service
    environment:
      - DB_API_URL=http://db_service:5000
    volumes:
      - ./data/database:/data:rw
    devices:
      - /dev/video0:/dev/video0
    restart: unless-stopped
    depends_on:
      - db_service
    networks:
      - face_net
    ports:
      - "5557:5555"
    command: ["python", "service_automation.py", "--mode", "authentication"]

  # Drowsiness detection service
  drowsiness_detector:
    extends:
      service: face-recognition-base
    container_name: fr-drowsiness-service
    devices:
      - /dev/video0:/dev/video0
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - face_net
    depends_on:
      - mjpg-streamer
    ports:
      - "5558:5555"
    command: ["python", "service_automation.py", "--mode", "drowsiness"]

  # Database service
  db_service:
    image: htmmhmd/face_recognition_db:3.1.4
    container_name: fr-db-service
    volumes:
      - ./data/database:/data:rw
      - ./src/database:/app/src/database:ro
      - ./src/config:/app/src/config:ro
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - face_net
    command: ["python", "-m", "src.database.api.db_api"]
    
  # Video streaming service
  mjpg-streamer:
    image: htmmhmd/mjpg-streamer:latest
    container_name: fr-mjpg-streamer
    ports:
      - "8080:8080"
    devices:
      - /dev/video0:/dev/video0
    environment:
      - CAMERA_DEVICE=/dev/video0
      - STREAM_PORT=8080
    restart: always
    networks:
      - face_net
    privileged: true

networks:
  face_net:
    driver: bridge

volumes:
  face_db_data:
    driver: local