version: '3.8'
services:
  face_recognizer:
    image:  htmmhmd/face_recognition:2.3.9
    # build: 
    #   context: .
    #   dockerfile: Dockerfile
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - DB_API_URL=http://db_service:5000
      - AV_LOG_LEVEL=0
      - OPENCV_FFMPEG_LOGLEVEL=0
    volumes:
      - ./:/app:ro
      - face_db_data:/data:rw
    devices:
      - /dev/video0:/dev/video0
    ipc: host
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - db_service
    networks:
      - face_net
    ports:
      - "9000:9000"
    command: ["python", "main.py", "-roc"  ,"-ed"]

  drowsiness_detector:
    image:  htmmhmd/face_recognition:2.3.9
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - AV_LOG_LEVEL=0
      - OPENCV_FFMPEG_LOGLEVEL=0
    volumes:
      - ./:/app:ro
    devices:
      - /dev/video0:/dev/video0
    ipc: host
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: ["python", "run_drawsy.py", "-roc", "-v"]

  db_service:
    image: htmmhmd/face_recognition_db:2.3.9
    # build: 
    #   context: .
    #   dockerfile: Dockerfile.db
    volumes:
      - face_db_data:/data:rw
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - face_net
    command: ["python", "database/db_api.py"]

networks:
  face_net:
    driver: bridge

volumes:
  face_db_data:
    driver: local